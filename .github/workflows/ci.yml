name: CI - Quality Gates

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
  workflow_dispatch:
    branches: [ main, master, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_TARGET_DIR: target

jobs:
  # ============================================================================
  # Tier 1: ON-SAVE (Sub-second checks)
  # ============================================================================
  tier1:
    name: "Tier 1: Quick Checks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo check
        run: cargo check --all-targets --all-features

      - name: Run clippy (fast)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run unit tests
        run: cargo test --lib

  # ============================================================================
  # Tier 2: ON-COMMIT (1-5 minutes)
  # ============================================================================
  tier2:
    name: "Tier 2: Full Test Suite"
    runs-on: ubuntu-latest
    needs: tier1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (strict)
        run: |
          cargo clippy --all-targets --all-features -- \
            -W clippy::pedantic \
            -W clippy::nursery \
            -D warnings

      - name: Run all tests
        run: cargo test --all-features

      - name: Generate coverage report
        run: |
          cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
          cargo llvm-cov --all-features --workspace --summary-only

      - name: Check coverage threshold (85%)
        run: |
          COVERAGE=$(cargo llvm-cov --all-features --workspace --summary-only | grep "TOTAL" | awk '{print $10}' | sed 's/%//')
          echo "Coverage: $COVERAGE%"
          if [ "$(echo "$COVERAGE < 85" | bc)" -eq 1 ]; then
            echo "❌ Coverage $COVERAGE% is below 85% threshold"
            exit 1
          fi
          echo "✓ Coverage $COVERAGE% meets 85% threshold"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: lcov.info
          fail_ci_if_error: false

  # ============================================================================
  # Tier 2: Security & Quality
  # ============================================================================
  security:
    name: "Security Audit"
    runs-on: ubuntu-latest
    needs: tier1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Run cargo deny
        run: cargo deny check

  # ============================================================================
  # Tier 3: ON-MERGE/NIGHTLY (Mutation Testing)
  # ============================================================================
  tier3-mutation:
    name: "Tier 3: Mutation Testing"
    runs-on: ubuntu-latest
    needs: tier2
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-mutants
        run: cargo install cargo-mutants

      - name: Run mutation testing
        continue-on-error: true
        run: |
          cargo mutants --no-times --output mutants.out
          echo "Mutation testing complete"

      - name: Check mutation score (85% threshold)
        run: |
          if [ -f "mutants.out/mutants.out" ]; then
            echo "Mutation test results:"
            cat mutants.out/mutants.out
            # Note: Add score extraction logic here
          fi

      - name: Upload mutation results
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          path: mutants.out/

  # ============================================================================
  # PMAT Quality Gates
  # ============================================================================
  pmat-quality:
    name: "PMAT Quality Gates"
    runs-on: ubuntu-latest
    needs: tier2
    if: false  # Disabled until PMAT is installed in CI
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install PMAT
        run: cargo install pmat

      - name: Run PMAT quality gates
        run: pmat quality-gates

      - name: Generate repository score
        run: pmat repo-score .

      - name: Check complexity
        run: pmat analyze complexity --path src/

      - name: Technical debt grading
        run: pmat analyze tdg
